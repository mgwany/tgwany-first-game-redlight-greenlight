<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover"
  />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="theme-color" content="#1a2332" />
  <meta name="description" content="Red Light, Green Light — tap the screen to move. Don't move on red!" />
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='12' fill='%231a2332'/%3E%3Ccircle cx='32' cy='18' r='8' fill='%23dc322f'/%3E%3Ccircle cx='32' cy='32' r='8' fill='%23fdcb6e'/%3E%3Ccircle cx='32' cy='46' r='8' fill='%232ecc40'/%3E%3C/svg%3E" />
  <title>Red Light, Green Light</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div id="app">
    <header class="hud" aria-live="polite">
      <div class="hud-row">
        <span id="levelLabel">Level 1</span>
        <span id="timeLabel">Time: 0.0s</span>
      </div>
      <p id="hint" class="hint">Tap the screen to move. Don't move on RED. Reach the finish line!</p>
    </header>

    <main id="stage" class="stage" role="application" aria-label="Red Light Green Light game. Tap to move forward.">
      <canvas id="game" width="800" height="500"></canvas>
      <div id="overlay" class="overlay hidden" aria-live="assertive">
        <p id="overlayTitle" class="overlay-title"></p>
        <p id="overlaySub" class="overlay-sub"></p>
        <p class="overlay-action">Tap the screen to continue</p>
      </div>
    </main>

    <footer class="light-bar" aria-hidden="true">
      <div class="traffic-light" id="trafficLight">
        <span class="bulb red" data-state="RED"></span>
        <span class="bulb yellow" data-state="YELLOW"></span>
        <span class="bulb green" data-state="GREEN"></span>
      </div>
      <p id="lightLabel" class="light-label">GREEN — Go!</p>
    </footer>
  </div>
  <script src="game.js"></script>
</body>
</html>
